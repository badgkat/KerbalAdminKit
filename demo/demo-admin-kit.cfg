// KerbalAdminKit demo content.
// Move this file to GameData/KerbalAdminKit/demo-admin-kit.cfg (or anywhere
// under GameData/) to exercise the full feature set without a content mod.
// Remove it to make KAK fall inert again.

KERBAL_ADMIN_KIT
{
    replaceAdminBuilding = true
    deskMemoCount = 3
    memoPollSeconds = 5
}

DIRECTOR_CHARACTER
{
    id = demo_gus
    displayName = Demo Gus
    role = Chief Engineer
    baseColor = #FFFFC078
    dispositionFlag = demo_gus_disposition
    defaultDisposition = Supportive
}

DIRECTOR_CHARACTER
{
    id = demo_wernher
    displayName = Demo Wernher
    role = Chief Scientist
    baseColor = #FF82B4E8
    dispositionFlag = demo_wernher_disposition
    defaultDisposition = Neutral
}

DIRECTOR_FOCUS
{
    character = demo_wernher
    id = materials_research
    title = Materials Research
    description = Wernher focuses on advanced alloys.
    flag = demo_wernher_focus
    flagValue = materials
}

DIRECTOR_FOCUS
{
    character = demo_wernher
    id = anomaly_research
    title = Anomaly Research
    description = Wernher studies the monoliths.
    flag = demo_wernher_focus
    flagValue = anomaly
}

DIRECTOR_MEMO
{
    id = demo_low_funds
    character = demo_gus
    priority = high
    text = Funds are low — we might have to cut corners on the next launch.
    postToStockMail = true
    CONDITION
    {
        type = FundsBelow
        threshold = 50000
    }
}

DIRECTOR_MEMO
{
    id = demo_high_rep
    character = demo_wernher
    priority = normal
    text = The scientific community is paying attention. Let's deliver.
    CONDITION
    {
        type = ReputationAbove
        threshold = 100
    }
}

DIRECTOR_BUILDING_SCENE
{
    facility = MissionControl
    character = demo_gus
    onClickScene = demo_gus_mc_scene
}

DIRECTOR_PR_CAMPAIGN
{
    baseCost = 25000
    tierCostMultiplier = 10000
    haltDecayDays = 30
    repBonus = 5
}

DISPOSITION_DECAY
{
    character = demo_wernher
    towardValue = Neutral
    stepDays = 30
    STEP
    {
        from = Enthusiastic
        to = Supportive
    }
    STEP
    {
        from = Supportive
        to = Neutral
    }
}
